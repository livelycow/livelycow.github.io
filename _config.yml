# ================================
#   LIVELYCOW BLOG — CONFIG
# ================================

title: "livelycow.dev"
tagline: "learning in public. one bug at a time."
description: >-
  A developer's log. Documenting the grind of learning programming,
  breaking things, and slowly figuring it out.

url: "https://livelycow.github.io"
baseurl: ""

theme: minima

minima:
  skin: dark

# --------------------------------
#   Author
# --------------------------------
author:
  name: livelycow
  email: goldlivelycow@protonmail.com

# --------------------------------
#   Social
# --------------------------------
github_username: livelycow
twitter_username: twitter_username

social:
  name: livelycow
  email: goldlivelycow@protonmail.com
  links:
    - https://github.com/livelycow
    - https://twitter.com/twitter_username

# --------------------------------
#   Posts
# --------------------------------
show_excerpts: true
paginate: 10

permalink: /posts/:title/

# --------------------------------
#   Plugins
# --------------------------------
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag

# --------------------------------
#   Defaults
# --------------------------------
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /posts/:title/

# --------------------------------
#   Build
# --------------------------------
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: true

exclude:
  - "*.gem"
  - "*.gemspec"
  - Gemfile.lock
  - README.md
  - LICENSE
